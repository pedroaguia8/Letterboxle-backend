services:
  postgres:
    image: postgres:17
    container_name: letterboxle-postgres-dev
    environment:
      - POSTGRES_USER=letterboxle
      - POSTGRES_PASSWORD=letterboxle
      - POSTGRES_DB=letterboxle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letterboxle"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
