name: ci
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    # Disposable Postgres for tests that need a database (TEST_DB_URL below).
    # They create and drop their own throwaway databases on it.
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: letterboxle
          POSTGRES_PASSWORD: letterboxle
          POSTGRES_DB: letterboxle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U letterboxle"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.2"

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run the tests
        env:
          TEST_DB_URL: postgres://letterboxle:letterboxle@localhost:5432/postgres?sslmode=disable
        run: go test ./... -cover

      - name: Run the security check
        run: gosec ./...

  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.2"

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: Check formatting
        run: test -z $(go fmt ./...)

      - name: Check linting
        run: staticcheck ./...

  image:
    name: Image
    runs-on: ubuntu-latest
    needs: [tests, style]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    env:
      IMAGE: ghcr.io/pedroaguia8/letterboxle-backend

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the pinned reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Pushed \`${IMAGE}:${GITHUB_SHA}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"